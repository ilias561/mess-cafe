<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Monstera deliciosa: heart-shaped outline with fenestrations -->
  <!-- Outline starts at base, goes up the LEFT side with cuts, around the tip, down RIGHT side with cuts -->
